[project]
name = "ai-engineering-buildcamp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "snap7979", email = "faizothman@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "elasticsearch>=8,<9",
    "gitsource>=0.0.5",
    "jaxn>=0.0.5",
    "jupyter>=1.1.1",
    "markitdown[pdf]>=0.1.8",
    "minsearch>=0.2.0",
    "openai>=3.19.2",
    "pydantic-ai>=2.54.0",
    "python-frontmatter>=1.3.0",
    "qdrant-client>=1.19.1",
    "streamlit>=1.66.0",
    "toyaikit>=0.0.11",
]

[project.scripts]
ai-engineering-buildcamp = "ai_engineering_buildcamp:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "03-agents/04-mcp/faq-mcp",
    "03-agents/03-mcp/pydantic-mcp-client",
    "04-duckdb-sql-homework",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["04-documentation-agent"]
